id: io.github.khaled_0.TubeSync
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: syncara
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - '*.la'
modules:
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dlua=disabled
      - -Ddebug=false
      - -Dbuild-date=false
      - -Dcplayer=false
      - -Dmanpage-build=disabled
      - -Dvulkan=enabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413
        # x-checker-data:
        #   type: git
        #   tag-pattern: ^v([\d.]+)$

    modules:
      - name: libass
        config-opts:
          - --disable-static
        sources:
          - type: git
            url: https://github.com/libass/libass.git
            tag: 0.17.4
            commit: bbb3c7f1570a4a021e52683f3fbdf74fe492ae84
            # x-checker-data:
            #   type: git
            #   tag-pattern: ^([\d.]+)$

      - name: libplacebo
        buildsystem: meson
        sources:
          - type: git
            url: https://code.videolan.org/videolan/libplacebo.git
            tag: v7.360.1
            commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
            # x-checker-data:
            #   type: git
            #   tag-pattern: ^v([\d.]+)$

  - name: syncara
    buildsystem: simple
    build-commands:
      - mkdir syncara
      - unzip syncara.zip -d syncara
      - cp -r syncara /app/
      - mkdir -p /app/bin
      - ln -s /app/syncara/syncara /app/bin/syncara
      - install -Dm0644 syncara.svg /app/share/icons/hicolor/scalable/apps/io.github.khaled_0.TubeSync.svg
      - install -Dm0644 io.github.khaled_0.TubeSync.desktop -t /app/share/applications/
      - install -Dm0644 io.github.khaled_0.TubeSync.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: file
        url: https://raw.githubusercontent.com/khaled-0/Syncara/4489e6f8c4f93b1d3cd455e2f7205bfb923628fe/LICENSE
        sha256: e57f1c320b8cf8798a7d2ff83a6f9e06a33a03585f6e065fea97f1d86db84052

      - type: file
        url: https://raw.githubusercontent.com/khaled-0/Syncara/refs/heads/main/linux/io.github.khaled_0.TubeSync.desktop
        sha256: 50a6ec15bd2bbd99b51e540737333646c5396aab04e5d2b4e3efd5a9470f1d62
        dest-filename: io.github.khaled_0.TubeSync.desktop
        x-checker-data:
          type: rotating-url
          url: https://raw.githubusercontent.com/khaled-0/Syncara/refs/heads/main/linux/io.github.khaled_0.TubeSync.desktop

      - type: file
        url: https://raw.githubusercontent.com/khaled-0/Syncara/refs/heads/main/linux/io.github.khaled_0.TubeSync.metainfo.xml
        sha256: fdbe411519d9754ffcbb4e94950940bbe2e53698c635a55d7a60a0a78e8385c5
        dest-filename: io.github.khaled_0.TubeSync.metainfo.xml
        x-checker-data:
          type: rotating-url
          url: https://raw.githubusercontent.com/khaled-0/Syncara/refs/heads/main/linux/io.github.khaled_0.TubeSync.metainfo.xml

      - type: file
        url: https://raw.githubusercontent.com/khaled-0/Syncara/refs/heads/main/assets/icons/syncara.svg
        sha256: 60f921c9928791d1e94cf1e421e90ead7f3d7211b3cda7dc13f9409b8c427f57
        dest-filename: syncara.svg
        x-checker-data:
          type: rotating-url
          url: https://raw.githubusercontent.com/khaled-0/Syncara/refs/heads/main/assets/icons/syncara.svg

      - type: file
        url: https://github.com/khaled-0/Syncara/releases/download/0.1.9/syncara_linux.zip
        sha256: 13d6a20e78e791438ddc4c38a4a331df2b1dc7fc2f7b2c0521e279c9f3ada245
        dest-filename: syncara.zip
        x-checker-data:
          type: json
          url: https://api.github.com/repos/khaled-0/Syncara/releases/latest
          tag-query: .tag_name
          version-query: $tag
          url-query: .assets[] | select(.name == "syncara_linux.zip") | .browser_download_url
